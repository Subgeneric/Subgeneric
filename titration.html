<style>
:root{
  --ink:#1a2b28; --muted:#5b726d; --line:#dbe7e4; --bg:#fff;
  --accent:#0a7562; --accent-hover:#085c4d; --soft:#f6faf9; --code:#f4f7f6;
  --font:"Be Vietnam Pro",-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,"Helvetica Neue",Arial,sans-serif;
}
*{box-sizing:border-box}
html{scroll-behavior:smooth}
body{
  margin:0;background:var(--bg);color:var(--ink);
  font-family:var(--font);font-size:16px;line-height:1.6;
  -webkit-font-smoothing:antialiased;-moz-osx-font-smoothing:grayscale;
}
button,input,select{font-family:var(--font)}
a{color:var(--accent)}
.wrap{max-width:820px;margin:0 auto;padding:0 22px}

header{border-bottom:1px solid var(--line);padding:16px 0}
header .wrap{display:flex;justify-content:space-between;align-items:baseline;gap:16px;flex-wrap:wrap}
header .name{font-weight:700;font-size:18px;letter-spacing:-.01em;text-decoration:none;color:var(--ink)}
.brand-symbol{display:inline-grid;place-items:center;width:30px;height:30px;margin-right:6px;border-radius:9px;background:#0a7562;color:#fff;vertical-align:middle}.brand-symbol svg{width:27px;height:27px}
header nav a{color:var(--muted);text-decoration:none;margin-left:18px;font-size:15px;font-weight:500}
header nav a:hover,header nav a[aria-current]{color:var(--ink);text-decoration:underline}

h1{font-size:28px;line-height:1.25;margin:36px 0 8px;font-weight:700;letter-spacing:-.015em}
h2{font-size:22px;margin:36px 0 10px;font-weight:700}
p{margin:0 0 14px}
.intro{color:var(--muted);margin-bottom:8px}

label{display:block;font-size:13px;color:var(--muted);margin-bottom:4px;font-weight:500}
input[type=text],input[type=number],select{
  font:inherit;font-size:15px;padding:8px 10px;border:1px solid var(--line);
  border-radius:4px;background:#fff;color:var(--ink);width:100%;
}
input:focus,select:focus{outline:2px solid #b8e0d6;border-color:var(--accent)}

button{
  font:inherit;font-size:15px;font-weight:600;padding:8px 16px;
  border:1px solid var(--accent);background:var(--accent);color:#fff;
  border-radius:4px;cursor:pointer;
}
button:hover{background:var(--accent-hover);border-color:var(--accent-hover)}
button.plain{background:#fff;color:var(--accent)}
button.plain:hover{background:#eef6f4}

.row{display:flex;gap:8px;flex-wrap:wrap}
.row>*{flex:1 1 auto}
.row>button{flex:0 0 auto}

.rig-card{margin:24px 0 22px;border:1px solid var(--line);border-radius:12px;background:linear-gradient(180deg,#fbfefd,#f4f9f7);overflow:hidden}
.rig-heading{display:flex;justify-content:space-between;gap:12px;align-items:baseline;padding:13px 16px 0}
.rig-heading strong{font-size:14px}.rig-heading span{font-size:12px;color:var(--muted)}
.rig-svg{display:block;width:100%;height:auto;max-height:340px}
#flaskLiquid,#fallingDrop{transition:fill 180ms ease-out}
.rig-caption{padding:0 16px 14px;color:var(--muted);font-size:12px}
.sim{display:grid;grid-template-columns:minmax(0,1.4fr) minmax(0,1fr);gap:20px;align-items:start}

canvas{

}
.ctrl{display:grid;gap:10px}
.two{display:grid;grid-template-columns:1fr 1fr;gap:10px}
input[type=range]{width:100%;accent-color:var(--accent)}

.readout{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:12px}
.readout div{
  background:var(--soft);border:1px solid var(--line);border-radius:4px;
  padding:8px 12px;font-size:13px;color:var(--muted);

<script>
function titrationPH(Ca,Va,Cb,Vb,pKa){
  var V=Va+Vb,Na=Cb*Vb/V,Ct=Ca*Va/V;
  var Ka=(pKa===null||pKa===undefined)?1e12:Math.pow(10,-pKa),Kw=1e-14;
  var lo=-1,hi=15;
  for(var it=0;it<80;it++){
    var mid=(lo+hi)/2,H=Math.pow(10,-mid);
    var fval=Na+H-Kw/H-Ct*Ka/(Ka+H);
    if(fval>0)lo=mid;else hi=mid;
  }
  return (lo+hi)/2;
}
var el=function(id){return document.getElementById(id)};
var canvas=el('curve'),ctx=canvas.getContext('2d'),timer=null;
function boundedInput(id,min,max,fallback){
  var input=el(id),value=Number(input.value);
  if(!Number.isFinite(value))value=fallback;
  value=Math.max(min,Math.min(max,value));
  input.value=String(value);
  return value;
}
function params(){
  var pk=el('acid').value;
  return {
    Ca:boundedInput('Ca',0.001,2,0.1),
    Va:boundedInput('Va',5,100,25),
    Cb:boundedInput('Cb',0.001,2,0.1),
    pKa:pk===''?null:parseFloat(pk)
  };
}
function lerp(a,b,t){return a+(b-a)*t}
function smoothStep(t){t=Math.max(0,Math.min(1,t));return t*t*(3-2*t)}
function mix(c1,c2,t){t=smoothStep(t);
  return [lerp(c1[0],c2[0],t),lerp(c1[1],c2[1],t),lerp(c1[2],c2[2],t)]}
function indicatorColor(kind,pH){
  var c;
  if(kind==='pp')c=mix([226,240,246],[233,30,140],(pH-8.2)/(10-8.2));
  else if(kind==='mo')c=mix([230,60,50],[250,200,40],(pH-3.1)/(4.4-3.1));
  else{
    var t=(pH-6.0)/(7.6-6.0);
    c=t<.5?mix([245,215,60],[110,180,90],t*2):mix([110,180,90],[50,110,210],(t-.5)*2);
  }
  return 'rgb('+c.map(Math.round).join(',')+')';
}
function resizeCanvas(){
  var dpr=window.devicePixelRatio||1,w=canvas.clientWidth,h=canvas.clientHeight;
  if(!w||!h)return;
  canvas.width=Math.round(w*dpr);canvas.height=Math.round(h*dpr);
  ctx.setTransform(dpr,0,0,dpr,0,0);
}
function draw(){
  var p=params(),Veq=p.Ca*p.Va/p.Cb,Vmax=Math.max(Veq*2,0.5);
  var slider=el('Vb');slider.max=String(Vmax);slider.step=String(Math.min(0.05,Vmax/100));
  if(parseFloat(slider.value)>Vmax)slider.value=Vmax;
  var Vb=parseFloat(slider.value)||0;
  var pH=titrationPH(p.Ca,p.Va,p.Cb,Vb,p.pKa);
  el('VbLabel').textContent=Vb.toFixed(2);
  el('pH').textContent=pH.toFixed(2);
  el('Veq').textContent=(Veq<0.1?Veq.toPrecision(3):Veq.toFixed(2))+' mL';
  var st;
  if(Math.abs(Vb-Veq)<Veq*0.01)st='Gần điểm tương đương: pH thay đổi nhanh.';
  else if(Vb<Veq)st='Trước điểm tương đương: acid vẫn còn dư.';
  else st='Sau điểm tương đương: NaOH dư làm dung dịch có tính base mạnh hơn.';
  el('tStatus').textContent=st;
  var liquid=el('flaskLiquid');if(liquid)liquid.setAttribute('fill',indicatorColor(el('ind').value,pH));
  var buret=el('buretLiquid');if(buret){var used=Math.max(0,Math.min(1,Vb/Vmax));buret.setAttribute('y',String(50+used*125));buret.setAttribute('height',String(Math.max(5,134-used*125)));}
  var drop=el('fallingDrop');if(drop){drop.setAttribute('opacity',Vb>=Vmax?'.15':'1');drop.setAttribute('fill',indicatorColor(el('ind').value,pH));}

  var W=canvas.clientWidth,H=canvas.clientHeight,L=44,R=14,T=14,B=34,pw=W-L-R,ph=H-T-B;
  ctx.clearRect(0,0,W,H);
  ctx.font='12px "Be Vietnam Pro",system-ui,sans-serif';
  var dark=document.documentElement.getAttribute('data-theme')==='dark';ctx.fillStyle=dark?'#a3b8b1':'#5b726d';ctx.strokeStyle=dark?'#2b4039':'#eef3f1';ctx.lineWidth=1;
  for(var y=0;y<=14;y+=2){
    var py=T+ph*(1-y/14);
    ctx.beginPath();ctx.moveTo(L,py);ctx.lineTo(W-R,py);ctx.stroke();
    ctx.textAlign='right';ctx.fillText(y,L-6,py+4);
  }
  ctx.textAlign='center';
  for(var i=0;i<=4;i++){
    var v=Vmax*i/4,px=L+pw*i/4;
    ctx.fillText(v.toFixed(1),px,H-14);
  }
  ctx.fillText('V NaOH (mL)',L+pw/2,H-1);
  ctx.save();ctx.translate(11,T+ph/2);ctx.rotate(-Math.PI/2);ctx.fillText('pH',0,0);ctx.restore();
  var eqx=L+pw*(Veq/Vmax);
  ctx.setLineDash([5,4]);ctx.strokeStyle=dark?'#e4bb59':'#c98a0a';
  ctx.beginPath();ctx.moveTo(eqx,T);ctx.lineTo(eqx,T+ph);ctx.stroke();ctx.setLineDash([]);
  ctx.fillStyle=dark?'#e4bb59':'#8a6008';ctx.fillText('tương đương',eqx,T+11);
  ctx.strokeStyle=dark?'#59c6a5':'#0a7562';ctx.lineWidth=2.5;ctx.beginPath();
  var N=240;
  for(var k=0;k<=N;k++){
    var v2=Vmax*k/N,ph2=titrationPH(p.Ca,p.Va,p.Cb,v2,p.pKa);
    var x=L+pw*k/N,yy=T+ph*(1-Math.max(0,Math.min(14,ph2))/14);
    if(k===0)ctx.moveTo(x,yy);else ctx.lineTo(x,yy);
  }
  ctx.stroke();
  var cx=L+pw*(Vb/Vmax),cy=T+ph*(1-Math.max(0,Math.min(14,pH))/14);
  ctx.fillStyle=indicatorColor(el('ind').value,pH);
  ctx.strokeStyle='#c33';ctx.lineWidth=3;
  ctx.beginPath();ctx.arc(cx,cy,6,0,Math.PI*2);ctx.fill();ctx.stroke();
}
function stopAuto(){if(timer){clearInterval(timer);timer=null}el('auto').textContent='Tự động'}
['acid','Ca','Va','Cb','ind'].forEach(function(id){
  el(id).addEventListener('input',function(){stopAuto();draw()});
});
el('Vb').addEventListener('input',function(){stopAuto();draw()});
el('drop').addEventListener('click',function(){
  stopAuto();
  var s=el('Vb');
  s.value=Math.min(parseFloat(s.max),parseFloat(s.value)+0.5);
  draw();
});
el('reset').addEventListener('click',function(){stopAuto();el('Vb').value=0;draw()});
el('auto').addEventListener('click',function(){
  if(timer){stopAuto();return}
  var s=el('Vb');
  if(parseFloat(s.value)>=parseFloat(s.max))s.value=0;
  el('auto').textContent='Dừng';
  timer=setInterval(function(){
    var max=parseFloat(s.max),step=max/160;
    s.value=Math.min(max,parseFloat(s.value)+step);
    draw();
    if(parseFloat(s.value)>=max)stopAuto();
  },40);
});
window.addEventListener('resize',function(){resizeCanvas();draw()});
resizeCanvas();draw();
</script>
<script>
(function(){
 var root=document.documentElement,button=document.getElementById('themeToggle');
 if(!button)return;
 function update(){var dark=root.getAttribute('data-theme')==='dark';button.textContent=dark?'☀ Chế độ sáng':'☾ Chế độ tối';button.setAttribute('aria-pressed',String(dark));button.setAttribute('aria-label',dark?'Chuyển sang chế độ sáng':'Chuyển sang chế độ tối');}
 button.addEventListener('click',function(){var next=root.getAttribute('data-theme')==='dark'?'light':'dark';root.setAttribute('data-theme',next);try{localStorage.setItem('subgeneric-theme',next)}catch(e){}update();if(typeof resizeCanvas==='function'&&typeof draw==='function'){resizeCanvas();draw();}});
 update();
})();
</script>
